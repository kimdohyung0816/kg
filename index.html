<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="apple-mobile-web-app-capable" content="yes"><title>제비뽑기 문구점</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;background:#f5efdf;color:#5b473d}.game{height:100vh;display:flex;gap:12px;padding:12px;background:linear-gradient(135deg,#fff9ec,#e8f5f3)}.left{width:34%;min-width:300px;background:#fffaf0;border:3px solid #ead7ba;border-radius:25px;padding:20px;display:flex;flex-direction:column;justify-content:center;gap:13px;box-shadow:0 7px 22px #0001}.left h1{margin:0;color:#95583f;font-size:clamp(28px,3.5vw,48px);letter-spacing:-2px}.guide{font-size:clamp(15px,1.5vw,21px);line-height:1.45}.customer{height:31%;min-height:155px;position:relative;display:flex;align-items:flex-end;justify-content:center;transform:translateX(-130%);transition:.65s cubic-bezier(.2,.8,.2,1)}.customer.show{transform:translateX(0)}.person{font-size:clamp(90px,10vw,150px)}.bubble{position:absolute;right:0;top:0;background:#fff;border:3px solid #765b4d;border-radius:22px;padding:13px 16px;font-size:clamp(18px,2vw,30px);font-weight:900;line-height:1.35;box-shadow:0 6px 16px #0001}.bubble:after{content:"";position:absolute;left:20px;bottom:-19px;border:10px solid transparent;border-top-color:#765b4d}.bubble:before{content:"";position:absolute;left:20px;bottom:-13px;border:8px solid transparent;border-top-color:#fff;z-index:2}.target{text-align:center;background:#fff;border:3px dashed #d6a36a;border-radius:17px;padding:9px}.target small{color:#8d7668}.word{font-size:clamp(25px,2.8vw,42px);font-weight:950;color:#784c3a}.buttons{display:flex;gap:8px;flex-wrap:wrap}button.action{border:0;border-radius:13px;padding:11px 14px;font-size:16px;font-weight:850;color:#fff;background:#7eaeca;box-shadow:0 4px 0 #5d8ca8;cursor:pointer}button.draw{background:#d19a61;box-shadow:0 4px 0 #aa7647}.status{text-align:center;color:#897166;font-size:14px;min-height:20px}.right{flex:1;position:relative;overflow:hidden;border:3px solid #ead7ba;border-radius:25px;box-shadow:0 9px 25px #0002;background:#8bd2f0}.scene{position:absolute;inset:0;width:100%;height:100%}.item{position:absolute;border:3px solid transparent;border-radius:15px;background:#ffffff15;color:#6b4a3c;font-size:clamp(13px,1.5vw,20px);font-weight:900;text-shadow:0 1px #fff;padding:5px;cursor:pointer}.item.target{border-color:#fff;box-shadow:0 0 0 7px #ffca5599,0 0 25px #ffd36acc;animation:pulse .75s infinite alternate}@keyframes pulse{to{transform:scale(1.04)}}.pop,.result{position:absolute;left:50%;transform:translateX(-50%);z-index:5;background:#fffdf4;border:3px solid #806253;border-radius:18px;padding:10px 22px;font-weight:950;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap}.pop{top:8%;font-size:clamp(24px,3vw,42px)}.result{bottom:3%;font-size:clamp(17px,2vw,27px)}.show{opacity:1}@media(max-width:850px){.left{width:39%;min-width:215px;padding:12px}.game{padding:6px;gap:6px}.guide{font-size:13px}.bubble{font-size:17px}button.action{font-size:13px;padding:9px 10px}}</style></head><body><div class="game"><section class="left"><h1>제비뽑기 문구점</h1><div class="guide">손님이 문구점에 왔어요!<br><b>말을 듣고 알맞은 물건을 찾아 주세요.</b></div><div class="customer" id="customer"><div class="bubble">할아버지,<br><span id="sentence">무엇을 드릴까요?</span></div><div class="person">👧🏻</div></div><div class="target"><small>오늘 연습할 낱말</small><div class="word" id="word">제비를 뽑아 주세요!</div></div><div class="buttons"><button class="action draw" id="draw">🎟️ 제비 뽑기</button><button class="action" id="repeat">🔊 다시 듣기</button><button class="action" id="reset">↻ 다시 하기</button></div><div class="status" id="status">제비 뽑기를 눌러 시작해요.</div></section><section class="right"><svg class="scene" viewBox="0 0 1000 700" preserveAspectRatio="xMidYMid slice"><rect width="1000" height="700" fill="#8bd2f0"/><circle cx="120" cy="110" r="75" fill="#fff" opacity=".35"/><circle cx="830" cy="95" r="95" fill="#fff" opacity=".3"/><path d="M0 610V220L90 165 500 45 900 165 1000 220V610Z" fill="#fffdf4" stroke="#b66c4b" stroke-width="10"/><path d="M60 210Q500 55 940 210" fill="none" stroke="#65a85c" stroke-width="35" stroke-linecap="round" opacity=".8"/><rect x="220" y="145" width="560" height="105" rx="15" fill="#fffdf4" stroke="#806253" stroke-width="6"/><text x="500" y="215" text-anchor="middle" font-size="62" font-weight="900" fill="#a65c3e">동네문구</text><path d="M120 255H880V360H120Z" fill="#4d9fd2"/><path d="M120 255H880" stroke="#376f9a" stroke-width="8"/><g fill="#fff" opacity=".85"><path d="M160 255v105h-40V255Z"/><path d="M260 255v105h-40V255Z"/><path d="M360 255v105h-40V255Z"/><path d="M460 255v105h-40V255Z"/><path d="M560 255v105h-40V255Z"/><path d="M660 255v105h-40V255Z"/><path d="M760 255v105h-40V255Z"/></g><rect x="155" y="340" width="690" height="255" rx="10" fill="#8c5d3f" stroke="#694531" stroke-width="8"/><rect x="185" y="370" width="630" height="180" fill="#c9a06f"/><g stroke="#8c5d3f" stroke-width="5"><path d="M310 370v180"/><path d="M435 370v180"/><path d="M560 370v180"/><path d="M685 370v180"/></g><circle cx="210" cy="405" r="42" fill="#dff6ff"/><circle cx="205" cy="400" r="16" fill="#fff"/><circle cx="245" cy="380" r="10" fill="#fff"/><g><rect x="325" y="410" width="75" height="38" rx="10" fill="#f7a5bd"/><circle cx="350" cy="390" r="18" fill="#f7b7c9"/><circle cx="380" cy="390" r="18" fill="#a9e3d1"/></g><g><rect x="450" y="400" width="80" height="55" rx="10" fill="#6ca9df"/><path d="M465 415h50" stroke="#fff" stroke-width="6"/></g><g><rect x="580" y="395" width="75" height="55" rx="7" fill="#fff"/><circle cx="600" cy="415" r="9" fill="#ef745c"/><circle cx="625" cy="415" r="9" fill="#f5c34f"/><circle cx="600" cy="438" r="9" fill="#66a6db"/><circle cx="625" cy="438" r="9" fill="#78bf78"/></g><g><path d="M710 450h70" stroke="#fff" stroke-width="10"/><path d="M725 435v-48" stroke="#ef7690" stroke-width="22" stroke-linecap="round"/><path d="M765 435v-48" stroke="#f2c24f" stroke-width="22" stroke-linecap="round"/></g><rect x="430" y="470" width="140" height="80" rx="10" fill="#fffaf0" stroke="#806253" stroke-width="5"/><circle cx="500" cy="505" r="25" fill="#f1c8a6"/><circle cx="490" cy="500" r="3" fill="#59463c"/><circle cx="510" cy="500" r="3" fill="#59463c"/><path d="M490 515q10 10 20 0" fill="none" stroke="#59463c" stroke-width="3"/></svg><button class="item" data-word="비눗방울" style="left:18%;top:57%;width:15%;height:18%">비눗방울</button><button class="item" data-word="말랑이" style="left:32%;top:57%;width:15%;height:18%">말랑이</button><button class="item" data-word="필통" style="left:45%;top:57%;width:16%;height:18%">필통</button><button class="item" data-word="물감" style="left:58%;top:57%;width:16%;height:18%">물감</button><button class="item" data-word="고드름" style="left:71%;top:57%;width:18%;height:19%">고드름</button><div class="pop" id="pop"></div><div class="result" id="result"></div></section></div><script>const words=["비눗방울","말랑이","필통","물감","고드름"],items=[...document.querySelectorAll(".item")],customer=document.getElementById("customer"),sentence=document.getElementById("sentence"),word=document.getElementById("word"),status=document.getElementById("status"),pop=document.getElementById("pop"),result=document.getElementById("result");let target=null;function speak(t){if(!( "speechSynthesis"in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang="ko-KR";u.rate=.82;speechSynthesis.speak(u)}function msg(t,good){result.textContent=t;result.style.borderColor=good?"#8bbd91":"#d69b8d";result.classList.add("show");setTimeout(()=>result.classList.remove("show"),1100)}function draw(){target=words[Math.floor(Math.random()*words.length)];sentence.textContent=target+" 주세요.";word.textContent=target;items.forEach(x=>x.classList.toggle("target",x.dataset.word===target));customer.classList.remove("show");void customer.offsetWidth;customer.classList.add("show");status.textContent="손님이 말한 물건을 매대에서 찾아 주세요.";setTimeout(()=>speak("할아버지, "+target+" 주세요."),450)}document.getElementById("draw").onclick=draw;document.getElementById("repeat").onclick=()=>target&&speak("할아버지, "+target+" 주세요.");document.getElementById("reset").onclick=()=>{target=null;customer.classList.remove("show");sentence.textContent="무엇을 드릴까요?";word.textContent="제비를 뽑아 주세요!";items.forEach(x=>x.classList.remove("target"));status.textContent="제비 뽑기를 눌러 시작해요."};items.forEach(x=>x.onclick=()=>{if(!target){msg("먼저 제비를 뽑아 주세요.",false);return}if(x.dataset.word===target){pop.textContent=target;pop.classList.add("show");msg("정답! "+target+"을(를) 샀어요!",true);status.textContent="좋아요! 낱말을 한 번 더 말해 볼까요?";speak(target);setTimeout(()=>pop.classList.remove("show"),1000)}else{msg("다시 찾아볼까요? "+target,false);status.textContent="손님이 말한 물건을 다시 찾아 보세요.";speak(target)}});</script></body></html>
